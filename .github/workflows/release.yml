name: Auto Release on Version Change

on:
  push:
    branches:
      - main
    paths:
      - 'app.html'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract App Version
        id: version
        run: |
          VER=$(grep -oP 'name="app-version"\s+content="\K[^"]+' app.html || echo "1.0.0")
          echo "tag=v${VER}" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "দামের খাতা ${{ steps.version.outputs.tag }}"
          body: |
            ### 🚀 দামের খাতা (Damer Khata) ${{ steps.version.outputs.tag }}
            
            স্বয়ংক্রিয় আপডেট ও নতুন রিলিজ।
            
            - **সরাসরি আপডেট**: ফোনে অ্যাপ খোলা থাকলে ইন্টারনেট পেলেই স্বয়ংক্রিয়ভাবে আপডেট হয়ে যাবে।
            - **নতুন ইনস্টলেশন**: নিচে সংযুক্ত `damer-khata.apk` ফাইলটি ডাউনলোড করে ইনস্টল করুন।
          files: |
            release/damer-khata.apk
          token: ${{ secrets.GITHUB_TOKEN }}
