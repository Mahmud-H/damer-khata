name: Auto Release & Update

on:
  push:
    branches:
      - main
    paths:
      - 'app.html'
      - 'release/**'
      - 'app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep -oP 'name="app-version"\s+content="\K[^"]+' app.html || echo "1.0.0")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found app version: $VERSION"

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          echo "Target Release Tag: $TAG"
          
          # Check if release tag already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading updated APK asset..."
            gh release upload "$TAG" release/damer-khata.apk --clobber
          else
            echo "Creating new Release $TAG..."
            gh release create "$TAG" release/damer-khata.apk \
              --title "দামের খাতা $TAG" \
              --notes "### 🚀 দামের খাতা (Damer Khata) $TAG
              
স্বয়ংক্রিয় আপডেট ও রিলিজ। 

- **সরাসরি আপডেট**: ফোনে অ্যাপটি খোলা থাকলে ইন্টারনেট পেলে এটি নিজে থেকেই সর্বশেষ কোড নামিয়ে নেবে।
- **নতুন ইনস্টলেশন**: নিচে সংযুক্ত \`damer-khata.apk\` ফাইলটি ডাউনলোড করে ইনস্টল করুন।"
          fi
